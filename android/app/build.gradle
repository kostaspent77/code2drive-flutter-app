plugins {
    id "com.android.application"
    id 'com.google.gms.google-services' // Εάν χρειάζεται για Firebase
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Φόρτωση του key.properties
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
} else {
    print("key.properties file not found!")
}

android {
    namespace = "com.example.code2drive"
    compileSdk = 34
    ndkVersion = flutter.ndkVersion

    defaultConfig {
        applicationId "com.example.your_app"
        minSdkVersion 23
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
            release {
                if (keystoreProperties['storeFile']) {
                    storeFile file(keystoreProperties['storeFile'])
                } else {
                    print("storeFile is not set in key.properties")
                }
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storePassword keystoreProperties['storePassword']
            }
        }


    buildTypes {
            release {
                signingConfig signingConfigs.release
                minifyEnabled true
                shrinkResources true
                proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            }
            debug {
                signingConfig signingConfigs.debug
            }
        }


    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

}

flutter {
    source = "../.."
}
